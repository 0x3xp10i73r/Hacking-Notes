site_name: 0x3xp10i73r
site_description: Web, API, Android and network security notes, writeups and tooling.
site_url: https://YOUR-USERNAME.github.io/knowledge-base/

theme:
  name: material
  custom_dir: overrides
  # extra.css overrides the actual rendered colors via CSS variables; these
  # just keep Material's own palette names consistent with that for anyone
  # reading this config.
  palette:
    - scheme: slate
      primary: deep purple
      accent: pink
  # Material's default font loader always requests 10 font files (6 weights
  # of the text font + 4 of the code font). We only actually use 5 total, so
  # font loading is disabled here and handled with a trimmed request in
  # overrides/main.html instead (see the `fonts` block override there).
  font: false
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  # The ?v= query string is a cache-buster: extra.css isn't content-hashed
  # like Material's own bundled CSS, so without this, browsers (and some
  # static-file servers) can keep serving a stale cached copy after a
  # rebuild. Bump this number any time extra.css changes.
  - stylesheets/extra.css?v=20

# No extra_javascript needed:
# - Material's own bundle already lazy-loads Mermaid from a CDN only on
#   pages that actually have a ```mermaid fence (pymdownx.superfences below
#   wires that up) — the old docs/javascripts/mermaid.min.js was a 3.5MB
#   file being sent on every single page regardless of whether it had a
#   diagram. Safe to delete that file from the repo.
# - giscus is loaded per-page from overrides/partials/comments.html only
#   when a page opts in with `comments: true`, so the old
#   docs/javascripts/giscus.js (an empty placeholder) can be deleted too.
# - The cursor-glow effect (docs/javascripts/cursor-effects.js) has been
#   dropped as part of the visual refresh; safe to delete that file too.

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - home: index.md
  - about: about.md
  - web-app-security:
      - index: web/index.md
      - example-sqli-writeup: web/example-sqli-writeup.md
  - api-security:
      - index: api/index.md
  - android-mobile:
      - index: android/index.md
      - owasp-mobile-top-10: android/OWASP-TOP-10.md
      - key-concepts: android/key-concepts.md
      - apk-structure: android/apk-structure.md
      - android-terminologies: android/terminologies.md
      - android-manifest: android/manifest.md
      - setup-and-installation: android/setup.md
      - network-interception: android/network-interception.md
      - frida-scripting: android/frida.md
      - tools-reference: android/tools-reference.md
      - static-analysis:
        - index: android/static-analysis/index.md
        - 01-reading-hardcoded-strings: android/static-analysis/hardcoded-secrets.md
        - 02-bad-cryptography-implementation: android/static-analysis/cryptography.md
        - 03-reversing-hybrid-and-native-apps: android/static-analysis/hybrid-native.md
        - 04-obfuscation-and-integrity-checks: android/static-analysis/obfuscation.md
      - dynamic-analysis:
        - index: android/dynamic-analysis/index.md
        - 01-filesystem-and-local-storage: android/dynamic-analysis/storage.md
        - 02-logging-screenshots-and-device-checks: android/dynamic-analysis/logging-root.md
        - 03-webview-review: android/dynamic-analysis/webview.md
        - 04-ipc-intents-and-deep-links: android/dynamic-analysis/ipc-and-intents.md
      - penetration-testing-checklist:
        - index: android/pentesting-checklist/index.md
        - authentication-and-authorization: android/pentesting-checklist/authentication.md
        - data-protection: android/pentesting-checklist/data-protection.md
        - network-and-code: android/pentesting-checklist/network-code.md
      - reporting-template: android/reporting.md
      - references: android/references.md
  - network-security:
      - index: network/index.md
  - bug-bounty-writeups:
      - index: bug-bounty/index.md
  - tools-cheatsheets:
      - index: tools/index.md

extra:
  generator: false  